# Local-run posture. Do not weaken either setting:
# - 127.0.0.1 is the repo rule for every published port; the Dockerfile overrides
#   the address for container-internal listening only (compose still publishes on
#   127.0.0.1 on the host).
# - gatherUsageStats=false: telemetry is decided here, at runtime config, not
#   trusted to defaults ("check telemetry at runtime" — root CLAUDE.md).
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
