[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "extrct"
version = "0.1.0"
description = "Schema-first structured extraction with LLMs: a provider registry (Ollama, OpenRouter), async single/batch lanes, a logged repair ladder, XAI (per-field certainty from logprobs + evidence grounding), and a content-addressed run log in Postgres or SQLite."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The extrct authors" }]
keywords = [
  "llm", "extraction", "structured-output", "json-schema", "logprobs",
  "grounding", "confidence", "openrouter", "ollama", "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# json-repair powers the deterministic rung of the repair ladder; without it the
# ladder still runs (fence-stripping only) — the rung degrades, never breaks.
repair = ["json-repair>=0.25"]
postgres = ["psycopg[binary]>=3.1"]
# Live traces: the OTel API alone makes extrct emit spans when a host application has
# configured an SDK; add the SDK+exporter yourself (or via this extra's docs) to ship
# them somewhere (Langfuse >=3.22 OTLP, Jaeger, console). Without the extra, telemetry
# is a no-op — zero overhead, zero new dependencies.
otel = ["opentelemetry-api>=1.20"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "json-repair>=0.25",
  "pydantic>=2.0",
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://github.com/sdamirsa/extrct"
Documentation = "https://github.com/sdamirsa/extrct/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/extrct"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
