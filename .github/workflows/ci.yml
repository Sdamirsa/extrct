name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: packages/extrct

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # setup-uv activates its own venv at the repo ROOT (exports VIRTUAL_ENV),
        # which `uv pip install` honours while `uv run` uses the project venv here -
        # two different environments, observed on run 2. `uv sync` ignores a
        # mismatched VIRTUAL_ENV by design and always targets the project's .venv.
        run: uv sync --extra dev
      - name: Test (offline — no model, no key, no network)
        run: uv run --no-sync python -m pytest tests/
      - name: Offline end-to-end demo
        run: uv run --no-sync python examples/00_offline_demo.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Wheel is extrct only
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          top = sorted({n.split("/")[0] for n in zipfile.ZipFile(whl).namelist()})
          assert all(t.startswith("extrct") for t in top), top
          print("ok:", top)
          EOF

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install with licence tooling
        run: |
          uv sync
          uv pip install --python .venv pip-licenses
      - name: Refuse copyleft in the dependency tree
        run: |
          uv run --no-sync pip-licenses --format=markdown
          uv run --no-sync pip-licenses --fail-on="GPL;GPLv2;GPLv3;AGPL;AGPLv3;LGPL;SSPL"
