name: release

# Tag-driven release to PyPI via Trusted Publishing (OIDC) — no API token is ever
# stored in this repo. PyPI is configured to trust exactly: this repo + this workflow
# filename + the `pypi` environment. Renaming this file breaks publishing until the
# trusted-publisher entry on PyPI is updated to match.
#
#   git tag -a v0.1.0 -m "extrct 0.1.0" && git push origin v0.1.0
#
# The guard below refuses to publish when the tag and pyproject version disagree,
# which is the classic way a release goes out mislabelled.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # manual dry run: builds and checks, never publishes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version = ' packages/extrct/pyproject.toml | cut -d'"' -f2)
          echo "tag=$TAG pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != pyproject version $VER"; exit 1; }

      - name: Tests must pass before anything is built
        working-directory: packages/extrct
        # `uv sync`, not `uv pip install`: setup-uv activates a venv at the repo
        # root, which uv pip honours while uv run uses the project venv (same fix
        # as ci.yml).
        run: |
          uv sync --extra dev
          uv run --no-sync python -m pytest tests/ -q

      - name: Build sdist + wheel
        working-directory: packages/extrct
        run: uv build

      - name: Check package metadata renders on PyPI
        working-directory: packages/extrct
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/extrct/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi          # add a required reviewer here for a manual gate
    permissions:
      id-token: write          # the OIDC token Trusted Publishing exchanges — no secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
